<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guest Guide</title>
    <meta name="description" content="Quick videos + essentials for a smooth stay." />

    <!-- La guía es para huéspedes, no para buscadores: que no aparezca en Google. -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      Restaura la ruta que guardó public/404.html (/guest-guide/?/arrival ->
      /guest-guide/arrival). Va primero que todo para que React y Analytics ya
      vean la URL correcta.
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

   <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-D1XY1Y6Y8Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    // send_page_view: false -> los page_view los envía React en cada cambio de
    // ruta (ver src/lib/analytics.js). Si se deja en true, la primera pantalla
    // se cuenta dos veces.
    gtag('config', 'G-D1XY1Y6Y8Y', {
      send_page_view: false,
      debug_mode: location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    });
  </script>
  </head>
  <body class="bg-zinc-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>


  </body>
</html>
